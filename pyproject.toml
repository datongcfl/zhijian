[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zhijian"
version = "1.0.0"
description = "智检 - AI 代码质量检测工具，基于 AI-SLOP-Detector 和 sloppylint 合并"
authors = [
    {name = "智检团队"}
]
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["ai", "code-quality", "static-analysis", "slop-detection", "code-review", "zhijian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "pyyaml>=6.0",
    "radon>=6.0.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=24.0",
    "ruff>=0.1.0",
]

[project.scripts]
zhijian = "zhijian.cli:main"

[project.urls]
Homepage = "https://github.com/datongcfl/zhijian"
Repository = "https://github.com/datongcfl/zhijian"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=zhijian --cov-report=term-missing -p no:cacheprovider"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
